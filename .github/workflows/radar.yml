# ─────────────────────────────────────────────────────────────────────────────
# ZEROHOUR · recolecta los datos y publica el sitio en la rama `deploy`
#
# main  = solo código (sin datos: su historial no crece).
# deploy = el sitio montado (web/ de main + datos), regenerado entero en cada
#          publicación como un commit huérfano. Ese commit es lo que se sube a Cloudflare.
#
# Tres jobs con permisos separados:
#   recolectar · contents: read  · instala dependencias y procesa datos de terceros
#   publicar   · contents: write · solo git y biblioteca estándar; el único que escribe,
#                                  y solo en la rama deploy (force-push), nunca en main
#   desplegar  · contents: read  · sube a Cloudflare Workers el commit recién publicado en
#                                  deploy, con wrangler (versión exacta y lockfile). Es el único
#                                  que ve el token de Cloudflare (entorno `cloudflare`, solo main)
# ─────────────────────────────────────────────────────────────────────────────
name: ZEROHOUR

on:
  # Los runs puntuales los lanza el Worker zerohour-cron (Cron Triggers de Cloudflare, cron/):
  # workflow_dispatch a las 05:00 UTC (daily) y a las :41 cada 3 h (map). Este schedule de
  # GitHub, que se encola con horas de retraso, queda SOLO como respaldo: si lo que trae ya está
  # publicado, el gate de recolectar no publica nada (salvo con force).
  schedule:
    # Respaldo del informe diario: 05:17 UTC → 06:17 en invierno / 07:17 en verano (hora de España)
    - cron: "17 5 * * *"
    # Respaldo del mapa de ataques: cada 3 horas
    - cron: "41 */3 * * *"
  # Cambios de código en main: se regenera deploy con los datos que ya había
  push:
    branches: [main]
    paths:
      - "web/**"
      - "cabeceras.toml"
      - "wrangler.jsonc"
      - "despliegue/package.json"
      - "despliegue/package-lock.json"
      - "scripts/montar_deploy.py"
      - "scripts/publicar_deploy.sh"
      - "scripts/validar_datos.py"
      - ".github/workflows/radar.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué ejecutar"
        type: choice
        options: [all, daily, map, deploy]
        default: all
      force:
        description: "Publicar aunque ya esté publicado (daily: la edición de hoy; map: < 150 min)"
        type: boolean
        default: false

permissions: {}          # nada por defecto: cada job pide lo justo

concurrency:
  group: radar-cve       # un solo run a la vez: nadie pisa la rama deploy de otro
  cancel-in-progress: false

jobs:
  recolectar:
    name: recolectar
    runs-on: ubuntu-24.04            # fijo: ubuntu-latest migra a 26
    timeout-minutes: 25
    # Entorno restringido a main: aquí viven NVD_API_KEY y CLOUDFLARE_RADAR_TOKEN. El token de
    # Radar solo lo ve este job (recolectar), nunca publicar, desplegar ni el frontend.
    environment: recolectar
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.gate.outputs.mode }}     # "nada" si no hay nada que publicar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # el código de pip no puede leer el token del disco

      - name: Elegir modo
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$EVENT" in
            workflow_dispatch) mode="$INPUT_MODE" ;;
            push)              mode="deploy" ;;
            schedule)          if [ "$SCHEDULE" = "17 5 * * *" ]; then mode="daily"; else mode="map"; fi ;;
            *)                 echo "Evento no previsto: $EVENT"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "Modo: $mode"

      # El histórico de 90 días vive en la rama deploy: se recupera de ahí antes de recolectar.
      # La primera vez la rama no existe: se comprueba antes, en vez de dejar fallar el checkout.
      - name: ¿Existe ya la rama deploy?
        id: rama
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          b64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # nosemgrep: unsafe-add-mask-workflow-command (solo corre en main: quien pudiera lanzar
          # un workflow con ::stop-commands:: ya tendría el token; Actions no enmascara su base64)
          echo "::add-mask::${b64}"
          if git -c "http.extraheader=AUTHORIZATION: basic ${b64}"                ls-remote --exit-code --heads "https://github.com/${REPO}.git" deploy > /dev/null; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            if [ "$rc" -ne 2 ]; then echo "::error::No se pudo consultar el remoto (git ls-remote: $rc)"; exit "$rc"; fi
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "Rama deploy todavía inexistente: primera publicación"
          fi

      - name: Recuperar los datos publicados (rama deploy)
        id: prev
        if: steps.rama.outputs.existe == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: deploy
          path: _prev
          persist-credentials: false
          sparse-checkout: web/data

      - name: Preparar data/ con lo publicado
        id: prep
        run: |
          mkdir -p data
          if [ -f _prev/web/data/latest.json ]; then
            echo "previos=true" >> "$GITHUB_OUTPUT"
          else
            echo "previos=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -d _prev/web/data ]; then
            cp -r _prev/web/data/. data/
            cp _prev/web/data/index.json _prev-index.json 2>/dev/null || true
            echo "Datos previos: $(ls data/days 2>/dev/null | wc -l) días en el histórico"
          else
            echo "Sin rama deploy todavía: primera publicación"
          fi

      # Sin duplicados: el Worker y el schedule de respaldo pueden traer lo mismo. Mira en lo que
      # ya está en deploy si la edición de hoy (daily) o un mapa de < 150 min (map) ya existen.
      # La concurrency serializa los runs, así que aquí se ve lo que dejó el run anterior.
      - name: ¿Ya está publicado?
        id: fresco
        if: steps.prep.outputs.previos == 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: python3 scripts/ya_publicado.py "$MODE" data/ | tee -a "$GITHUB_OUTPUT"

      # Sin datos publicados todavía, "deploy" (push a main) y "map" no tienen informe que
      # publicar. Y si lo que trae este run ya está publicado (y no viene con force), tampoco.
      # En los dos casos el run acaba en verde con un aviso, sin validar ni publicar nada.
      - name: ¿Hay algo que publicar?
        id: gate
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          PREVIOS: ${{ steps.prep.outputs.previos }}
          FRESCO: ${{ steps.fresco.outputs.fresco }}
          DETALLE: ${{ steps.fresco.outputs.detalle }}
          FORCE: ${{ inputs.force }}           # vacío en schedule y push: cuenta como false
        run: |
          if [ "$PREVIOS" != "true" ] && { [ "$MODE" = "deploy" ] || [ "$MODE" = "map" ]; }; then
            echo "::notice::Aún no hay datos publicados: lanza primero un run manual en modo all. Este run ($MODE) no publica nada."
            echo "mode=nada" >> "$GITHUB_OUTPUT"
          elif [ "$FRESCO" = "true" ] && [ "$FORCE" != "true" ]; then
            echo "::notice::Ya publicado: ${DETALLE}. Este run ($MODE) no publica nada (para forzarlo: Run workflow con force)."
            echo "mode=nada" >> "$GITHUB_OUTPUT"
          else
            echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: contains(fromJSON('["daily","map","all"]'), steps.gate.outputs.mode)
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: contains(fromJSON('["daily","map","all"]'), steps.gate.outputs.mode)
        # Versiones exactas con hashes SHA-256 (requirements.txt se genera desde requirements.in)
        run: pip install --require-hashes --no-deps -r requirements.txt

      - name: Caché de la base de DB-IP (una descarga al mes)
        if: steps.gate.outputs.mode == 'map' || steps.gate.outputs.mode == 'all'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/geo
          key: dbip-${{ steps.mode.outputs.month }}

      - name: Ejecutar radar (${{ steps.gate.outputs.mode }})
        if: contains(fromJSON('["daily","map","all"]'), steps.gate.outputs.mode)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}   # solo en recolectar, por env
          GITHUB_TOKEN: ${{ github.token }}   # solo lectura (contents: read): consulta de GHSA
          MODE: ${{ steps.gate.outputs.mode }}
        run: python scripts/radar.py "$MODE"

      - name: Validar los datos (si no cuadran, no se publica nada)
        if: steps.gate.outputs.mode != 'nada'
        run: |
          if [ -f _prev-index.json ]; then
            python3 scripts/validar_datos.py data/ --previo _prev-index.json
          else
            python3 scripts/validar_datos.py data/
          fi

      - name: Pasar los datos al job que publica
        if: steps.gate.outputs.mode != 'nada'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: datos
          path: data/
          retention-days: 1
          if-no-files-found: error

      - name: Copia de seguridad de los datos (7 días)
        if: steps.gate.outputs.mode == 'daily' || steps.gate.outputs.mode == 'all'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copia-datos-${{ github.run_id }}
          path: data/
          retention-days: 7

  publicar:
    name: publicar
    needs: recolectar
    if: needs.recolectar.outputs.mode != 'nada'
    runs-on: ubuntu-24.04            # fijo: ubuntu-latest migra a 26
    timeout-minutes: 10
    permissions:
      contents: write                    # el único permiso de escritura del workflow
    outputs:
      commit: ${{ steps.push.outputs.commit }}   # el commit de deploy que se sube a Cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: datos
          path: data

      - name: Validar otra vez (por si el artifact llegó mal)
        run: python3 scripts/validar_datos.py data/

      - name: Montar el sitio (web/ de main + datos + _headers generado)
        run: python3 scripts/montar_deploy.py --web web --data data --out _deploy

      - name: Publicar en la rama deploy (force-push solo a deploy)
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ needs.recolectar.outputs.mode }}
          SHA: ${{ github.sha }}
        run: |
          b64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # nosemgrep: unsafe-add-mask-workflow-command (solo corre en main: quien pudiera lanzar
          # un workflow con ::stop-commands:: ya tendría el token; Actions no enmascara su base64)
          echo "::add-mask::${b64}"      # Actions enmascara el token, no su base64: se añade a mano
          export GIT_AUTH_HEADER="AUTHORIZATION: basic ${b64}"
          bash scripts/publicar_deploy.sh _deploy "https://github.com/${REPO}.git" \
            "deploy: ${MODE} · $(date -u +'%Y-%m-%d %H:%M') UTC · código ${SHA::7}"

  desplegar:
    name: desplegar
    needs: publicar
    runs-on: ubuntu-24.04            # fijo: ubuntu-latest migra a 26
    timeout-minutes: 10
    permissions:
      contents: read
    # Los secrets de Cloudflare viven en este entorno, restringido a la rama main:
    # ningún otro job ni ninguna otra rama los ve.
    environment:
      name: cloudflare
      url: ${{ vars.SITIO_URL }}
    steps:
      # Solo lo necesario de main: el lockfile de wrangler
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: despliegue
          path: main

      # Exactamente el commit que publicar acaba de dejar en deploy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publicar.outputs.commit }}
          path: _deploy
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # npm ci: versiones y hashes del lockfile; sin scripts de instalación de terceros
      - name: Instalar wrangler (versión exacta del lockfile)
        working-directory: main/despliegue
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Comprobar el sitio antes de subirlo
        run: |
          test -f _deploy/wrangler.jsonc && test -f _deploy/web/_headers && test -f _deploy/web/index.html \
            && test -f _deploy/web/data/latest.json && test -f _deploy/web/.well-known/security.txt \
            || { echo "::error::El commit de deploy no tiene el sitio completo"; exit 1; }
          grep -q "require-trusted-types-for 'script'" _deploy/web/_headers \
            || { echo "::error::_headers sin la CSP: no se despliega"; exit 1; }
          rm -rf _deploy/.git

      - name: Desplegar en Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltan los secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID en el entorno cloudflare"
            exit 1
          fi
          main/despliegue/node_modules/.bin/wrangler deploy --config _deploy/wrangler.jsonc

      # Lo que ve un visitante: la CSP en la cabecera y los datos que se acaban de subir
      - name: Comprobar producción
        if: vars.SITIO_URL != ''
        env:
          SITIO: ${{ vars.SITIO_URL }}
        run: |
          want="$(python3 -c 'import json;print(json.load(open("_deploy/web/data/latest.json"))["generated_at"])')"
          for i in 1 2 3 4 5 6; do
            # nosemgrep: gha-curl-pipe-shell (no ejecuta lo descargado: un programa fijo lee el JSON)
            got="$(curl -fsS "${SITIO}/data/latest.json" | python3 -c 'import json,sys;print(json.load(sys.stdin)["generated_at"])' || true)"
            [ "$got" = "$want" ] && break
            sleep 10
          done
          [ "$got" = "$want" ] || { echo "::error::Producción sirve generated_at=$got, se esperaba $want"; exit 1; }
          curl -fsSI "${SITIO}/" | grep -qi "^content-security-policy: default-src 'none'" \
            || { echo "::error::Producción sin la CSP"; exit 1; }
          echo "✓ ${SITIO} sirve la edición ${want} con la CSP"
