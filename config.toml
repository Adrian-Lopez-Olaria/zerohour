# ─────────────────────────────────────────────
#  Radar CVE · configuración
#  Todo lo que quieras ajustar sin tocar código
# ─────────────────────────────────────────────

[general]
# Horas hacia atrás que mira el informe diario (26 h para cubrir retrasos del cron)
ventana_horas = 26
# Días hacia atrás para considerar "recién añadida" una CVE al catálogo KEV de CISA
kev_dias = 3
# Cuántas CVE salen en el bloque "Las que importan hoy"
top_n = 10
# A cuántas candidatas se les busca PoC pública (las de mayor puntuación)
poc_candidatas = 60
# Días de histórico que se conservan en data/index.json
dias_historico = 90
# Identificación educada ante las APIs (pon la URL de tu repo cuando lo tengas)
user_agent = "RadarCVE/1.0 (+https://github.com/TU_USUARIO/radar-cve)"

# Tu stack: si una CVE menciona alguna de estas palabras, se marca con ⭐
# Se busca, sin distinguir mayúsculas, en fabricante, producto, CNA y CPE (fabricante:producto)
# y también en la descripción, salvo que esta case con un patrón de [stack.excluir].
[stack]
palabras = [
  "fortinet", "fortios", "fortigate", "fortimanager", "forticlient",
  "mikrotik", "routeros",
  "pfsense", "netgate",
  "vmware", "esxi", "vcenter", "vsphere",
  "acronis",
  "wazuh",
  "windows server", "active directory", "exchange server", "remote desktop",
  "wordpress",
  "veeam",
  "synology", "qnap",
]

# Exclusiones por palabra (expresiones regulares, sin distinguir mayúsculas).
# Si la DESCRIPCIÓN casa con alguno de estos patrones, esa palabra deja de contar por la
# descripción (sigue contando si aparece en fabricante, producto o CPE).
# Ej.: "The X plugin for WordPress…" es un plugin de terceros, no WordPress. Para seguir
# un plugin concreto, añádelo por su nombre a `palabras` (p. ej. "elementor", "woocommerce").
[stack.excluir]
# Wordfence: "The X plugin for WordPress…" · WPScan: "The X WordPress plugin before…"
# Patchstack: "…This issue affects WordPress File Upload: from n/a through 5.2.1" (un plugin que se
# llama "WordPress Algo"); no excluye "This issue affects WordPress: from…", que sería el core.
wordpress = [
  '\b(?:plugin|theme) for wordpress\b',
  '\bwordpress (?:plugin|theme)\b',
  '\bthis issue affects (?!wordpress:)[^:]{0,120}\bwordpress\b[^:]{0,120}:',
]

# Grafía de marcas: NVD da fabricante y producto en minúsculas (gitlab, vmware…) y el pipeline
# los capitaliza ("Gitlab"); este mapa corrige la grafía oficial. Clave en minúsculas; se aplica
# a palabras o expresiones completas. Lo que no esté aquí se queda como antes.
[marcas]
"gitlab" = "GitLab"
"github" = "GitHub"
"vmware" = "VMware"
"esxi" = "ESXi"
"vcenter" = "vCenter"
"vsphere" = "vSphere"
"fortinet" = "Fortinet"
"fortios" = "FortiOS"
"fortigate" = "FortiGate"
"fortimanager" = "FortiManager"
"forticlient" = "FortiClient"
"fortiweb" = "FortiWeb"
"mikrotik" = "MikroTik"
"routeros" = "RouterOS"
"pfsense" = "pfSense"
"wordpress" = "WordPress"
"woocommerce" = "WooCommerce"
"phpmyadmin" = "phpMyAdmin"
"ios xe" = "IOS XE"
"ios xr" = "IOS XR"
"nx-os" = "NX-OS"
"pan-os" = "PAN-OS"
"qnap" = "QNAP"
"qts" = "QTS"
"synology" = "Synology"
"dsm" = "DSM"
"sonicwall" = "SonicWall"
"sonicos" = "SonicOS"
"netscaler" = "NetScaler"
"openssl" = "OpenSSL"
"openssh" = "OpenSSH"
"macos" = "macOS"
"iphone os" = "iPhone OS"
"ipados" = "iPadOS"
"jetbrains" = "JetBrains"
"teamcity" = "TeamCity"
"sap" = "SAP"
"ibm" = "IBM"
"hp" = "HP"
"hpe" = "HPE"
"d-link" = "D-Link"
"tp-link" = "TP-Link"
"zyxel" = "Zyxel"

# Si NVD aún no da fabricante ni producto, se intenta deducir de la descripción.
# `regex` (sin distinguir mayúsculas) debe tener un grupo con nombre "producto".
# Si ningún patrón casa, la web muestra el CNA (quién publicó la CVE).
# Formato Wordfence: "The X plugin for WordPress is vulnerable…"
[[fabricante]]
regex = '^The (?P<producto>.{2,250}?) plugin for WordPress\b'
nombre = "Plugin WordPress"

[[fabricante]]
regex = '^The (?P<producto>.{2,250}?) theme for WordPress\b'
nombre = "Tema WordPress"

# Formato WPScan: "The X WordPress plugin before 1.2…" o "X WordPress plugin 1.0 before…"
[[fabricante]]
regex = '^(?:The )?(?P<producto>.{2,250}?)\s+WordPress plugin\b'
nombre = "Plugin WordPress"

[[fabricante]]
regex = '^(?:The )?(?P<producto>.{2,250}?)\s+WordPress theme\b'
nombre = "Tema WordPress"

# Pesos de la puntuación propia (0-100). Juega con ellos: es tu "sello".
# Seis filas con un máximo cada una; los máximos suman 100. Dentro de una fila no se suma
# dos veces: "explotada" vale KEV o SSVC (lo mayor), "exploit" vale verificado o PoC.
[puntuacion]
cvss_max = 30            # CVSS 10 → 30 (sin CVSS aún: valor neutro del 40 %)
epss_max = 20            # percentil EPSS 1.0 → 20
explotada_kev = 25       # en el catálogo KEV de CISA (explotación confirmada)
explotada_ssvc = 20      # SSVC "active" de CISA (Vulnrichment) sin estar todavía en KEV
ransomware = 5           # uso conocido en campañas de ransomware (según KEV)
exploit_verificado = 15  # módulo de Metasploit, plantilla de Nuclei o exploit verificado de Exploit-DB
exploit_poc = 6          # PoC sin verificar: PoC-in-GitHub, Exploit-DB sin verificar, referencia
                         # de NVD con etiqueta Exploit o SSVC "poc"
stack = 5                # afecta a tu stack

# Mínimos: una CVE explotada nunca puede quedar en "PLANIFICAR". Si la suma de las filas
# queda por debajo, el score sube al mínimo y el JSON lo indica (score_breakdown.floor),
# para que la web lo muestre: no es una nota inflada sin explicación.
[puntuacion.minimos]
explotada = 70           # KEV o SSVC "active" → al menos "ESTA SEMANA"
explotada_critica = 85   # explotada y además en tu stack, con ransomware o con exploit
                         # verificado → "ACTUAR HOY"

# Fuentes RSS: avisos y noticias. Se enlazan a las CVE que mencionen.
[[rss]]
nombre = "INCIBE-CERT Avisos"
url = "https://www.incibe.es/incibe-cert/alerta-temprana/avisos/feed"
tipo = "aviso"
idioma = "es"

[[rss]]
nombre = "INCIBE-CERT Avisos SCI"
url = "https://www.incibe.es/incibe-cert/alerta-temprana/avisos-sci/feed"
tipo = "aviso"
idioma = "es"

# CERT-EU solo publica avisos que considera graves (señal, no volumen). Su RSS casi nunca
# trae el CVE: con leer_pagina se descarga la página del aviso (mismo dominio, timeout y
# tamaño máximo) y se extraen solo los IDs de CVE con una regex.
[[rss]]
nombre = "CERT-EU"
url = "https://cert.europa.eu/publications/security-advisories-rss"
tipo = "aviso"
idioma = "en"
leer_pagina = true

[[rss]]
nombre = "BleepingComputer"
url = "https://www.bleepingcomputer.com/feed/"
tipo = "noticia"
idioma = "en"

[[rss]]
nombre = "The Hacker News"
url = "https://feeds.feedburner.com/TheHackersNews"
tipo = "noticia"
idioma = "en"

# Resumen con IA (opcional y gratis con GitHub Models).
# Si está desactivado o falla, se usa el resumen por plantilla.
[ia]
activado = false
endpoint = "https://models.github.ai/inference/chat/completions"
modelo = "openai/gpt-4o-mini"

[mapa]
# Nº de IPs atacantes que se piden a SANS ISC / DShield y se geolocalizan.
# Ojo: sources/attacks/{n}/{fecha} NO es un top del día: es el ranking acumulado de DShield
# (IPs vistas desde hace años) filtrado a las que siguen activas desde esa fecha. Con 200 salían
# casi solo escáneres de larga vida (4-5 países); con 2000, unos 60 países y ~200 zonas (~20 KB).
ips = 2000
# Si salen menos países que esto, el job lo avisa (anotación de GitHub Actions)
min_paises = 10
# Geolocalización offline con DB-IP Lite (CC BY 4.0): la base mensual se descarga por
# HTTPS, se verifica con el SHA-1 que publica DB-IP y se guarda en esta caché local.
geo_cache = ".cache/geo"
